worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # No path, query, method, address, headers or body enters application logs.
  log_format harbor escape=json '{"status":$status,"bytes":$body_bytes_sent,"seconds":$request_time,"correlation":"$request_id"}';
  access_log /dev/stdout harbor;
  sendfile on;
  keepalive_timeout 65;
  include /etc/nginx/conf.d/*.conf;
}
