server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 1k;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  add_header Cache-Control no-store always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

  location = /healthz {access_log off; return 200 'ok';}
  location = / {try_files /index.html =404;}
  location = /index.html {try_files /index.html =404;}
  location ~ ^/(infrastructure|topology|recovery|history)$ {rewrite ^ /index.html last;}
  location ~ ^/assets/[A-Za-z0-9_-]+\.(js|css|svg)$ {try_files $uri =404;}
  location / {return 404;}
}
