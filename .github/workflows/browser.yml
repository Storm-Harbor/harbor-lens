name: Harbor Lens sandbox
on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_dispatch:
concurrency:
  group: lens-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
permissions:
  contents: read
jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26.10.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.11
          cache-dependency-path: test/contracts/go.sum
      - run: node .yarn/releases/yarn-4.18.0.cjs install --immutable
      - run: node .yarn/releases/yarn-4.18.0.cjs format:check
      - run: node .yarn/releases/yarn-4.18.0.cjs test:tooling
      - name: Check drafts against the published recovery contract
        run: |
          test -z "$(gofmt -l test/contracts/*.go)"
          node .yarn/releases/yarn-4.18.0.cjs test:contracts
      - run: node .yarn/releases/yarn-4.18.0.cjs build
      - run: node .yarn/releases/yarn-4.18.0.cjs test:coverage
      - name: Qualify the Go static-process supervisor
        run: |
          test -z "$(gofmt -l runtime/*.go)"
          go -C runtime vet ./...
          go -C runtime test -race -coverprofile=../coverage/static-runtime.out ./...
          go -C runtime tool cover -func=../coverage/static-runtime.out > coverage/static-runtime-summary.txt
          cat coverage/static-runtime-summary.txt
          awk '/^total:/ { found=1; if ($3+0 < 97) exit 1 } END { if (!found) exit 1 }' coverage/static-runtime-summary.txt
      - run: node .yarn/releases/yarn-4.18.0.cjs exec playwright install --with-deps chromium
      - name: Build and start the actual Compose runtime
        run: docker compose --project-name harbor-lens-ci up --build --detach lens
        env:
          HARBOR_LENS_PORT: 4179
      - name: Wait for container readiness
        run: curl --fail --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:4179/healthz
      - run: node .yarn/releases/yarn-4.18.0.cjs test:browser
        env:
          LENS_TEST_ORIGIN: http://127.0.0.1:4179/
      - name: Verify actual runtime logs, privacy and bounded shutdown
        run: node tools/check-runtime.mjs
        env:
          LENS_TEST_ORIGIN: http://127.0.0.1:4179/
          HARBOR_LENS_QA_PROJECT: harbor-lens-ci
      - name: Stop the owned test runtime
        if: always()
        run: docker compose --project-name harbor-lens-ci down --remove-orphans
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: synthetic-sandbox-evidence
          path: |
            coverage/
            test-results/
          if-no-files-found: error

  image:
    name: Publish qualified preview image
    needs: sandbox
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_ENVIRONMENT: production
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_PUBLISHER_SERVICE_ACCOUNT: ${{ vars.GCP_PUBLISHER_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26.10.0
      - name: Validate the release boundary and build before credentials exist
        run: node tools/publish-image.mjs build
      - name: Obtain short-lived publisher credentials
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PUBLISHER_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          token_format: access_token
          access_token_lifetime: 900s
          create_credentials_file: false
          export_environment_variables: false
      - name: Authenticate Docker to the scoped registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Publish or verify the existing immutable source tag
        run: node tools/publish-image.mjs publish
        env:
          REGISTRY_TOKEN: ${{ steps.auth.outputs.access_token }}
      - name: Preserve the allowlisted publication receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-image-receipt-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/harbor-lens-image-receipt.json
          if-no-files-found: error
